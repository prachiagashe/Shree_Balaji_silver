<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Jewellery Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/receipt-print.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="white"/>
                    </svg>
                </div>
                <h2 class="sidebar-title">SHREE BALAJI</h2>
                <p class="sidebar-subtitle">Silver & Jewellery</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-item-icon">📊</span>
                    Dashboard
                </a>
                <a href="create-receipt.html" class="nav-item">
                    <span class="nav-item-icon">📝</span>
                    Create Receipt
                </a>
                <a href="receipt-history.html" class="nav-item">
                    <span class="nav-item-icon">📋</span>
                    Receipt History
                </a>
                <a href="customers.html" class="nav-item active">
                    <span class="nav-item-icon">👥</span>
                    Customers
                </a>
                <a href="reports.html" class="nav-item">
                    <span class="nav-item-icon">📈</span>
                    Reports
                </a>
                <a href="#" class="nav-item" onclick="exportToExcel()">
                    <span class="nav-item-icon">📊</span>
                    Export to Excel
                </a>
                <a href="#" class="nav-item" id="logoutBtn">
                    <span class="nav-item-icon">🚪</span>
                    Logout
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <h1 class="page-title">Customers</h1>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="showAddCustomerModal()">+ Add Customer</button>
                    <button class="btn btn-success" onclick="exportCustomersExcel()">📊 Export Customers</button>
                    <button class="btn btn-warning" onclick="exportCustomerTotalsExcel()">📊 Export Totals</button>
                </div>
            </div>

            <!-- Customer Search -->
            <div class="table-container">
                <div class="table-header">
                    <h2 class="table-title">Customer List</h2>
                    <div class="table-filters">
                        <input 
                            type="text" 
                            id="searchCustomer" 
                            class="filter-input" 
                            placeholder="Search customers by name or mobile..."
                        >
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Mobile</th>
                                <th>Address</th>
                                <th>Total Receipts</th>
                                <th>Total Amount</th>
                                <th>Total Paid</th>
                                <th>Outstanding</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="customersBody">
                            <!-- Customers will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Customer Modal -->
    <div class="modal-overlay hidden" id="customerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Add Customer</h3>
                <button class="modal-close" onclick="closeCustomerModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="customerForm">
                    <div class="form-group">
                        <label class="form-label">Customer Name <span class="required">*</span></label>
                        <input type="text" id="customerName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mobile Number <span class="required">*</span></label>
                        <input type="tel" id="customerMobile" class="form-control" required pattern="[0-9]{10}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Address</label>
                        <textarea id="customerAddress" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="customerEmail" class="form-control">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeCustomerModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveCustomer()">Save Customer</button>
            </div>
        </div>
    </div>

    <!-- Customer Details Modal -->
    <div class="modal-overlay hidden" id="customerDetailsModal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h3 class="modal-title">Customer Details</h3>
                <button class="modal-close" onclick="closeCustomerDetailsModal()">×</button>
            </div>
            <div class="modal-body" id="customerDetailsContent">
                <!-- Customer details will be loaded here -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeCustomerDetailsModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/customers.js"></script>
</body>
</html>
