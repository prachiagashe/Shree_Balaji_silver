<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewellery Shop - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="white"/>
                    </svg>
                </div>
                <h1 class="login-title">SHREE BALAJI</h1>
                <p class="login-subtitle">Silver & Jewellery</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email or Username</label>
                    <input 
                        type="text" 
                        id="email" 
                        class="form-control" 
                        placeholder="Enter your email or username"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-control" 
                            placeholder="Enter your password"
                            required
                        >
                        <button type="button" class="password-toggle" id="togglePassword">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            
            <div class="demo-notice">
                <strong>⚠️ Demo Mode Only</strong><br>
                This is a frontend demonstration. Use any email/password to login.<br>
                No real authentication - data is stored in browser localStorage only.
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
